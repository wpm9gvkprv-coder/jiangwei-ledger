server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ledger?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:ledger_app}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
app:
  jwt-secret: ${JWT_SECRET:}
  jwt-minutes: 120
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
